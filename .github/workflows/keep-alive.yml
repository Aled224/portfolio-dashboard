name: Tieni sveglia l'app

# Streamlit mette in pausa le app che non ricevono visite per giorni. Qui apriamo
# davvero la pagina con un browser, cosi' la visita conta come traffico vero: un
# curl secco non basta, viene respinto o non apre nessuna sessione.
# Se l'app non risponde il job diventa rosso e GitHub manda una mail di avviso:
# e' anche la sentinella che segnala quando l'app si rompe.
#
# NOTA: funziona solo se l'app e' pubblica (protetta dalla password interna).
# Se torna "privata" con login Google, nessun robot puo' entrare e il ping fallisce.

on:
  schedule:
    - cron: '23 */6 * * *'   # ogni 6 ore (l'app va in pausa dopo giorni, non ore)
  workflow_dispatch:          # avvio manuale dal sito di GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il programma
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa il browser
        run: |
          pip install playwright==1.49.1
          playwright install --with-deps chromium

      - name: Apri l'app (e risvegliala se dorme)
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: python keep_alive.py
