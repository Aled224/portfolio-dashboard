name: Aggiorna prezzi

on:
  schedule:
    # ogni lunedì alle 09:00 UTC (= 11:00 ora italiana legale)
    - cron: '0 9 * * 1'
  workflow_dispatch:   # avvio manuale dal sito di GitHub, quando vuoi tu

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il programma
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le librerie
        run: pip install requests

      - name: Aggiorna i prezzi e invia il report
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_PATH: data.json
          DATA_BRANCH: main
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          APP_URL: ${{ secrets.APP_URL }}
        run: python update_prices.py

      - name: Lascia una traccia (anti-pausa GitHub)
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git commit -m "keep-alive: ultima esecuzione automatica" || echo "nessuna modifica"
          git push
